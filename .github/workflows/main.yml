name: linting, testing, building

on: 
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs: 
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x ]
 
    steps:
      - uses: actions/checkout@v2

      - name: Starting Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build production project
        run: npm run build:prod

      - name: Linting TypeScript
        run: npm run lint:ts

      - name: Linting SCSS
        run: npm run lint:scss

      - name: Unit testing
        run: npm run test:unit

      - name: Build Storybook
        run: npm run storybook:build

      - name: Install Chrome & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-liberation fonts-noto
          mkdir -p ~/.fonts
          curl -L -o ~/.fonts/Archivo-Regular.ttf "https://github.com/google/fonts/raw/main/ofl/archivo/Archivo-Regular.ttf"
          fc-cache -f -v

      - name: Check Chrome version
        run: google-chrome-stable --version || echo "Chrome is not installed"

      - name: Start Storybook server
        run: npx http-server ./storybook-static -p 6006 & echo $! > storybook.pid

      - name: Wait for Storybook
        run: sleep 10

      - name: Check Storybook server
        run: curl -Is http://localhost:6006 | head -n 1

      - name: Screenshot testing (Debug)
        run: npx loki --verbose test --reactUri="http://localhost:6006"

      - name: Stop Storybook server
        run: kill $(cat storybook.pid) || true
