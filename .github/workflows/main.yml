name: linting, testing, building

on: 
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs: 
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x ]
 
    steps:
      - uses: actions/checkout@v2

      - name: Starting Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build production project
        run: npm run build:prod

      - name: Linting TypeScript
        run: npm run lint:ts

      - name: Linting SCSS
        run: npm run lint:scss

      - name: Unit testing
        run: npm run test:unit

      - name: Build Storybook
        run: npm run storybook:build

      - name: Install Chrome if missing
        run: |
          if ! command -v google-chrome-stable &> /dev/null
          then
            echo "Chrome is not installed. Installing..."
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable fonts-liberation fonts-noto
          else
            echo "Chrome is already installed."
          fi

      - name: Start Storybook server
        run: npx http-server ./storybook-static -p 6006 & echo $! > storybook.pid

      - name: Wait for Storybook to be ready
        run: sleep 5

      - name: Screenshot testing (Debug)
        run: npx loki --verbose test --reactUri="http://localhost:6006"

      - name: Stop Storybook server
        run: kill $(cat storybook.pid) || true
